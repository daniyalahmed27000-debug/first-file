<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"

    <title>Document</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;

      nav {
        display: flex;
        height: 80px;

      }

        width: 50%;
        height: 100%;
        align-content: center;
        text-align: center;
      }
      .ch3 {
        width: 20%;
        height: 100%;
        align-content: center;
        text-align: center;

      i {

        font-size: 18px;
      }
      a {
